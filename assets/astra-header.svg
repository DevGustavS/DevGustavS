<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="ASTRA BLACK profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset=".55" stop-color="#09090b"/>
      <stop offset="1" stop-color="#100b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="79%" cy="48%" r="48%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".58"/>
      <stop offset=".34" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#7c3aed" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".032"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
