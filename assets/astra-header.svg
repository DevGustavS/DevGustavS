  </defs>

  <rect width="1200" height="280" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="12" fill="url(#scan)"/>
  <circle cx="950" cy="138" r="205" fill="url(#glow)">
    <animate attributeName="opacity" values=".72;1;.72" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(948 140)">
