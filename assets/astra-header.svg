    <text x="55" y="65" fill="#a78bfa" font-size="15" letter-spacing="3">ASTRA // BLACK</text>
    <text x="55" y="116" fill="#f0f6fc" font-size="39" font-weight="700" letter-spacing="-1">DEVGUSTAVS</text>
